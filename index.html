<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Collection 测试入口</title>
    <style>
      body { font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif; margin: 0; background: #f7f6f2; color: #27352d; }
      main { max-width: 32rem; margin: 12vh auto; padding: 2rem; }
      h1 { font-size: 1.5rem; }
      a { display: block; padding: 1rem; margin-top: 1rem; border: 1px solid #d4dbd4; border-radius: .75rem; color: inherit; text-decoration: none; background: white; }
      a:hover, a:focus-visible { border-color: #52765c; }
    </style>
  </head>
  <body>
    <main>
      <h1>Collection 测试入口</h1>
      <a href="./wardrobe/#/collection">Main + Wardrobe</a>
      <a href="./goods/#/collection">Goods Test</a>
    </main>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          const rootScope = new URL("./", location.href).href;
          for (const registration of registrations) {
            if (registration.scope === rootScope) registration.unregister();
          }
        });
      }
    </script>
  </body>
</html>
